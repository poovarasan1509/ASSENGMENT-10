<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my task</title>
    <style>

        .cont{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,150px);
            gap: 15px;
            padding: 20px;
        }
          
        .grid{
            background-color: aqua;
            color: white;
            font font-size: 25px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

          .layout{
            display: grid;
            grid-template-areas:
             "header header header"
            "sidebar content content"
            "footer footer footer";
            grid-template-columns: 1fr 3fr 1fr ;
            grid-template-rows: 80px 400px 60px;
            border: 5px solid violet;
            margin-top: 20px;
            
        }
        .header{
            grid-area:header;
            background-color: aqua;
            text-align: center;
        }
        .sidebar{
            grid-area: sidebar;
            background-color: rgb(134, 180, 88);
        }
        .content{
            grid-area: content;
            background-color: cornflowerblue;
            text-align: center;

        }
        .footer{
            grid-area: footer;
            background-color: coral; 
        }

        .cardgrid{
            display: grid;
            padding: 10px;   
            gap: 20px; 
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
        }

        .card{
            display: flex;
           color: bisque;
            justify-content: center;
            background-color: darkslategray;
            height: 200px;
            align-items: center;
            border-radius: 10px;
        }

         .layout-2 {
    display: grid;

    grid-template-columns: 200px repeat(3, 1fr);
    grid-template-rows: 70px 120px 1fr;

    grid-template-areas:
        "sidebar header header header"
        "sidebar users sales revenue"
        "sidebar activity reports reports";

    gap: 10px;
    min-height: 500px;

    border: 5px solid rgb(116, 60, 116);
    margin-top: 20px;
    padding: 10px;
}


.sidebar-1 {
    grid-area: sidebar;
    background-color: brown;
}


.header-2 {
    grid-area: header;
    background-color: aquamarine;
}


.users {
    grid-area: users;
    background-color: lightblue;
}

.sales {
    grid-area: sales;
    background-color: lightgreen;
}

.revenue {
    grid-area: revenue;
    background-color: lightpink;
}


.sidecontent-1 {
    grid-area: activity;
    background-color: cadetblue;
}

.content-1 {
    grid-area: reports;
    background-color: darkcyan;
}


.layout-2 > div {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
}






    </style>
</head>
<body>

    <h1> CSS GRID LAYOUT MODELS </h1>

    <H2>TASK 1 basic grid layout</H2>

    <div class="cont">
        <div class="grid">guru</div>
        <div class="grid">poov</div>
        <div class="grid">dharush</div>
        <div class="grid">kaviya</div>
        <div class="grid">janu</div>
        <div class="grid">priya</div>
    </div>

    <h2>TASK 2 website page layout </h2>

    <div class="layout">
    <div class="header"> header</div>
    <div class="sidebar">sidebar</div>
    <div class="content">Maincontent</div>
    <div class="footer">Footer</div>
    </div>

    <h2>TASK 3 card grit model</h2>

    <div class="cardgrid">
        <div class="card">card A</div>
        <div class="card">card B</div>
        <div class="card">card C</div>
        <div class="card">card D</div>
        <div class="card">card E</div>
        </div>

    <h2>TASK 5 DASHBOARD</h2>

    <div class="layout-2">

    <div class="sidebar-1">Sidebar</div>
    <div class="header-2">Top header</div>
    <div class="users">Users</div>
    <div class="sales">Sales</div>
    <div class="revenue">content1</div>
    <div class="sidecontent-1">main</div>
    <div class="content-1">Reports </div>
        
    </div>


</body>
</html>
